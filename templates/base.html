<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EarlyDetect{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');
</style>
  <style>
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #21262d;
      --accent:    #3fb950;
      --accent2:   #58a6ff;
      --warn:      #f0883e;
      --danger:    #f85149;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --radius:    12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: var(--accent2); text-decoration: none; }
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(12px);
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--text); }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 1.5rem; font-size: 0.9rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.4rem; border-radius: var(--radius);
      font-family: inherit; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-primary  { background: var(--accent);  color: #000; }
    .btn-secondary{ background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-primary:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn-secondary:hover{ border-color: var(--accent2); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .disclaimer {
      font-size: 0.78rem; color: var(--warn);
      border: 1px solid rgba(240,136,62,0.3);
      background: rgba(240,136,62,0.06);
      padding: 0.75rem 1rem; border-radius: 8px; line-height: 1.5;
    }
    main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="logo">Early<span>Detect</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/screening">Screening</a>
    </div>
  </nav>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
